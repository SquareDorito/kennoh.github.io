<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTA Kindle — Ken Noh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --bg: #fffdf7;
      --grid: rgba(24, 24, 27, 0.06);
      --ink: #18181b;
      --muted: #52525b;
      --paper: #ffffff;
      --shadow: #18181b;
      --sticker-yellow: #fde047;
      --sticker-pink: #f9a8d4;
      --sticker-blue: #7dd3fc;
      --sticker-mint: #86efac;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg);
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 28px 28px;
      color: var(--ink);
      font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding: 1.5rem 1.25rem 4.75rem;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    .top-nav {
      display: flex;
      align-items: center;
      margin-bottom: 1.1rem;
    }

    .pill-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      border: 2px solid #18181b;
      border-radius: 999px;
      padding: 0.35rem 0.85rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.8rem;
      font-weight: 700;
      box-shadow: 3px 3px 0 var(--shadow);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .pill-link:hover {
      transform: translate(-1px, -2px);
      box-shadow: 4px 4px 0 var(--shadow);
    }

    .pill-link.accent {
      background: var(--sticker-mint);
    }

    h1 {
      display: inline-block;
      font-size: clamp(1.9rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      background: var(--sticker-yellow);
      color: #18181b;
      padding: 0.35rem 0.85rem;
      border: 2.5px solid #18181b;
      border-radius: 12px;
      box-shadow: 4px 4px 0 var(--shadow);
      transform: rotate(-1deg);
      margin-bottom: 1.5rem;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1.35rem;
      align-items: start;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    @media (min-width: 720px) {
      .stage {
        grid-template-columns: 270px minmax(0, 1fr);
      }
    }

    /* Comic Speech Bubble */
    .comic-bubble {
      position: relative;
      background: #fef9c3;
      color: #18181b;
      border: 2.5px solid #18181b;
      border-radius: 16px;
      padding: 1.1rem 1.2rem;
      box-shadow: 5px 5px 0 var(--shadow);
      font-size: 0.95rem;
    }

    .comic-bubble strong {
      display: block;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.45rem;
    }

    .comic-bubble p + p {
      margin-top: 0.55rem;
    }

    .comic-bubble::before {
      content: "";
      position: absolute;
      bottom: -14px;
      left: 28px;
      border-width: 14px 10px 0 10px;
      border-style: solid;
      border-color: #18181b transparent transparent transparent;
    }

    .comic-bubble::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 30px;
      border-width: 11px 8px 0 8px;
      border-style: solid;
      border-color: #fef9c3 transparent transparent transparent;
    }

    @media (min-width: 720px) {
      .comic-bubble::before {
        bottom: auto;
        left: auto;
        top: 28px;
        right: -14px;
        border-width: 10px 0 10px 14px;
        border-color: transparent transparent transparent #18181b;
      }

      .comic-bubble::after {
        bottom: auto;
        left: auto;
        top: 30px;
        right: -10px;
        border-width: 8px 0 8px 11px;
        border-color: transparent transparent transparent #fef9c3;
      }
    }

    /* Contained Kindle Frame */
    .kindle-bezel {
      background: #18181b;
      border: 3px solid #18181b;
      border-radius: 18px;
      padding: 0.75rem;
      box-shadow: 6px 6px 0 var(--sticker-blue);
    }

    .kindle-screen {
      width: 100%;
      height: clamp(460px, calc(100vh - 175px), 680px);
      border: 2px solid #27272a;
      border-radius: 10px;
      background: #222;
      display: block;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      background: var(--paper);
      border-top: 2.5px solid #18181b;
      padding: 0.85rem 1.25rem;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .footer-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .footer-links {
      display: flex;
      gap: 0.6rem;
    }

    .footer-links a {
      color: #18181b;
      background: var(--sticker-yellow);
      text-decoration: none;
      padding: 0.22rem 0.55rem;
      border: 2px solid #18181b;
      border-radius: 6px;
      box-shadow: 2px 2px 0 #18181b;
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="top-nav">
      <a class="pill-link" href="/">← kennoh.xyz</a>
    </nav>

    <div class="stage">
      <div class="left-col">
        <h1>MTA Kindle</h1>

        <aside class="comic-bubble">
          <p>
            Jailbroken Kindle polls this server using TRMNL BYOS every 30 seconds for nearby LIC subway trains.
          </p>
        </aside>
      </div>

      <div class="kindle-bezel">
        <iframe
          class="kindle-screen"
          src="https://mta.kennoh.xyz/"
          title="MTA Kindle Live Departure Board"
          loading="lazy"
        ></iframe>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-inner">
      <span>kennoh.xyz</span>
      <nav class="footer-links" aria-label="Footer links">
        <a href="https://github.com/SquareDorito" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/kennoh" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="mailto:kennoh415@gmail.com">Email</a>
      </nav>
    </div>
  </footer>
</body>
</html>
